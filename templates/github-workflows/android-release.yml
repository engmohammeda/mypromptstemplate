# =============================================================================
# REFERENCE TEMPLATE — copy into an Android app repository as
# .github/workflows/android-release.yml
#
# Required secrets:
#   KEYSTORE_BASE64            base64 -w0 upload-keystore.jks
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON  (Release manager on this app only)
#
# Required environment: `production` — protected, with required reviewers.
# =============================================================================
name: Android Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

permissions:
  contents: read

jobs:
  build:
    name: Build signed bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew

      - id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="0.0.0-manual"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Full check before releasing
        run: ./gradlew detekt lintRelease testReleaseUnitTest

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set +x
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build AAB and APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Verify signature and debuggable flag
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$APK" | grep -q "application-debuggable" \
            && { echo "::error::Release APK is debuggable"; exit 1; } || echo "OK: not debuggable"

      - name: Shred keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

  publish:
    name: Publish to Google Play
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production   # protected: requires manual approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Upload to Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.company.app
          releaseFiles: artifacts/bundle/release/*.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
          mappingFile: artifacts/mapping/release/mapping.txt
          whatsNewDirectory: distribution/whatsnew

      - name: Summary
        run: |
          {
            echo "## Published"
            echo "- Version: ${{ needs.build.outputs.version }}"
            echo "- Track: ${{ inputs.track || 'internal' }}"
            echo "- Next: staged rollout 1% → 5% → 20% → 50% → 100% (see release-runbook.md)"
          } >> "$GITHUB_STEP_SUMMARY"
